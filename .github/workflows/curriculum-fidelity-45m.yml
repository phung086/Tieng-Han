name: Curriculum fidelity audit (45-minute slots)
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/audit-curriculum-fidelity*'
      - '.github/workflows/curriculum-fidelity-45m.yml'
      - 'docs/CURRICULUM_FIDELITY_LOOP.md'
permissions:
  contents: read
  issues: write
concurrency:
  group: curriculum-fidelity-audit-${{ github.ref }}
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Select a nominal 45-minute audit slot
        id: slot
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" != "schedule" ]] || (( ( $(date -u +%s) / 900 ) % 3 == 0 )); then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.slot.outputs.run == 'true'
      - uses: actions/setup-node@v4
        if: steps.slot.outputs.run == 'true'
        with:
          node-version: '22'
      - name: Regression tests for failure continuation
        if: steps.slot.outputs.run == 'true'
        id: regression
        continue-on-error: true
        run: node --test scripts/audit-curriculum-fidelity.test.mjs
      - name: Audit every available course independently
        if: steps.slot.outputs.run == 'true'
        id: fidelity
        continue-on-error: true
        env:
          HANEUL_AUDIT_NONBLOCKING: '1'
        run: node scripts/audit-curriculum-fidelity.mjs
      - name: Publish cycle status (including blocked steps)
        if: always() && steps.slot.outputs.run == 'true'
        shell: bash
        run: |
          {
            echo "## Curriculum-fidelity cycle"
            echo "- Regression tests: ${{ steps.regression.outcome }}"
            echo "- Course audit: ${{ steps.fidelity.outcome }}"
            echo "- All blockers are recorded; the next scheduled cycle remains eligible."
            echo "- A nonblocking audit is not a release-quality gate or an AI code-writing agent."
            echo "- Imported textbook data and verified inventories are not present on a default hosted runner."
          } >> "$GITHUB_STEP_SUMMARY"
          if [[ -f .haneul/reports/curriculum-fidelity-latest.json ]]; then
            node -e '
              const fs = require("node:fs");
              const x = JSON.parse(fs.readFileSync(".haneul/reports/curriculum-fidelity-latest.json", "utf8"));
              fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,
                "\n- Data status: **" + x.status + "**; courses: " + x.coursesChecked +
                "; lessons: " + x.lessonsChecked + "; issues: " + x.issueCount +
                "; warnings: " + x.warningCount + "; backlog tasks: " + x.backlog.length + ".\n");
            ' || true
          else
            echo "- Missing report (runner/script fault). Examine logs; do not treat as passed." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Save report as an immutable cycle artifact
        uses: actions/upload-artifact@v4
        if: always() && steps.slot.outputs.run == 'true'
        with:
          name: curriculum-fidelity-${{ github.run_id }}-${{ github.run_attempt }}
          path: .haneul/reports/curriculum-fidelity-latest.json
          if-no-files-found: warn
          retention-days: 30
      - name: Maintain a single actionable blocker issue
        if: always() && github.event_name == 'schedule' && steps.slot.outputs.run == 'true'
        uses: actions/github-script@v7
        continue-on-error: true
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const report = '.haneul/reports/curriculum-fidelity-latest.json';
            const marker = '<!-- haneul-fidelity-audit-backlog -->';
            const title = '[Haneul] Curriculum fidelity development backlog';
            let body = marker + '\n## Audit infrastructure blocked\nNo report was produced. Inspect the latest scheduled workflow run; retry in the next cycle.';
            if (fs.existsSync(report)) {
              const data = JSON.parse(fs.readFileSync(report, 'utf8'));
              const queue = (data.backlog || []).slice(0, 100);
              body = [
                marker,
                '## Latest known work queue',
                '**Status:** ' + data.status + ' | **Issues:** ' + data.issueCount + ' | **Unverified:** ' + data.warningCount,
                '**Checked:** ' + data.coursesChecked + ' courses / ' + data.lessonsChecked + ' lessons.',
                '',
                'This issue records unresolved work; an external authorized coding agent must implement fixes in isolated PRs.',
                'Absence of source fixtures is a blocker to certification, not a reason to stop future cycles.',
                '',
                ...queue.map((task, i) => (i + 1) + '. ' + '[' + task.code + '] ' + task.scope +
                  ' — ' + task.nextAction),
                ...(data.backlog.length > 100 ? ['Other tasks remain in the downloadable report artifact.'] : []),
              ].join('\n');
            }
            const {owner, repo} = context.repo;
            const items = await github.paginate(github.rest.issues.listForRepo, {owner, repo, state:'open', per_page:100});
            const existing = items.find(item => !item.pull_request && item.body?.includes(marker));
            if (existing) {
              if (existing.body !== body) {
                await github.rest.issues.update({owner, repo, issue_number:existing.number, body});
              }
            } else {
              await github.rest.issues.create({owner, repo, title, body});
            }
